name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # 阈值为 high：electron-builder 构建链上的 sprintf-js 中危公告（GHSA-hp3w-g68c-fv3c）全版本受影响、
      # 暂无修复版，且该包不进安装包。高危照常拦截；sprintf-js 发出修复版后改回 moderate
      - run: npm audit --audit-level=high
      - run: npm run source:check
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
